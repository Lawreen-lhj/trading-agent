# 交易 Agent 配置 —— 由 Web 控制台管理（python server.py）
# 手动编辑同样生效；注意界面保存时会重写本文件（旧版本备份在 data/backup/）。

meta:
  name: A股短线简报
  timezone: Asia/Shanghai
  style: short
  source_primary: 东方财富 push2 接口
  source_secondary: 腾讯行情（备源）
risk:
  capital: 100000
  single_risk_pct: 1.0
  max_hold_days: 5
  atr_stop_mult: 1.5
  min_rr: 1.8
  min_score: 48
watchlist:
- code: '601366'
  name: 利群股份
  tag: 一般零售
- code: 000599
  name: 青岛双星
  tag: 汽车零部
- code: '002522'
  name: 浙江众成
  tag: 塑料
- code: '601566'
  name: 九牧王
  tag: 服装家纺
- code: '002300'
  name: 太阳电缆
  tag: 电网设备
- code: 002992
  name: 宝明科技
  tag: 光学光电
- code: '601188'
  name: 龙江交通
  tag: 铁路公路
- code: '600327'
  name: 大东方
  tag: 一般零售
- code: 000591
  name: 太阳能
  tag: 电力
- code: '603258'
  name: 电魂网络
  tag: 游戏Ⅱ
- code: '600118'
  name: 中国卫星
  tag: 选股
- code: '300033'
  name: 同花顺
  tag: 选股
holdings: []
thresholds:
  pct_change_p1: 4.0
  pct_change_p0: 7.0
  volume_ratio_p1: 1.8
  volume_ratio_stall: 2.2
  bias5_hot: 10.0
  rsi6_hot: 88.0
  up_days_hot: 5.0
  fade_gain: 4.0
  drawdown_from_high_p1: 0.2
  stop_loss_buffer: 0.03
  rsi_overbought: 78.0
  rsi_oversold: 25.0
global_watch:
  us_indices:
  - symbol: .IXIC
    name: 纳斯达克
  - symbol: .INX
    name: 标普500
  - symbol: .DJI
    name: 道琼斯
  hk_indices:
  - HSI
  - HSTECH
  crypto:
  - BTC
  - ETH
notify:
  macos: true
  title: A股短线简报
  sound: Glass
  only_on_p0: false
sentiment:
  enabled: true
  board_height_sample: 50
  north_flow_threshold: 50
screener:
  enabled: true
  top_n: 30
  hard_filters:
    exclude_st: true
    min_list_days: 60
    exclude_suspended: true
    exclude_one_word: true
    min_market_cap: 3000000000
    min_avg_amount: 50000000
  volume_price:
    min_vol_ratio: 1.0
    max_vol_ratio: 5.0
    min_turnover_ratio: 0.8
  price_position:
    max_distance_to_high20: 0.2
    min_distance_to_low20: 0.05
    require_above_ma5: true
strategies:
  enabled: true
  board_hit:
    enabled: true
    min_float_cap: 5000000000
    max_float_cap: 30000000000
    min_seal_ratio: 0.003
    max_board_height: 3
    suitable_phases:
    - 回暖
    - 高潮
    - 中性
  trend_pullback:
    enabled: true
    min_ret20: 0.08
    max_ret20: 0.35
    max_bias5: 0.05
    max_vol_ratio: 0.85
    suitable_phases:
    - 中性
    - 回暖
    - 退潮
  oversold_bounce:
    enabled: true
    min_drawdown: 0.15
    max_rsi6: 25
    min_close_pos: 0.55
    max_bias5: -0.05
    suitable_phases:
    - 冰点
    - 退潮
  event_driven:
    enabled: true
    event_types:
    - earnings_surprise
    - policy_support
    - equity_incentive
    - insider_buy
    - buyback
    - merger_acquisition
    - contract_win
    suitable_phases:
    - 冰点
    - 退潮
    - 中性
    - 回暖
    - 高潮
simulation:
  enabled: true
  initial_capital: 100000
  account_id: default
  fees:
    commission_rate: 0.0003
    min_commission: 5.0
    stamp_tax_rate: 0.0005
    transfer_fee_rate: 1.0e-05
    slippage: 0.002
  risk:
    max_single_position_pct: 0.3
    max_total_position_pct: 0.9
    max_daily_loss_pct: 0.05
    max_daily_trades: 20
    max_hold_days: 5
    min_cash_reserve: 5000
  auto_trade: false
  flow_pool_topn: 15
  # 把最近一次选股结果接入模拟盘候选域：false=不接(默认) / true|passed=只接过漏斗或策略直命 / all=全部候选
  include_screening: false
  screening_max_age_days: 3   # 选股结果超过此天数不接（0=不限）
  screening_topn: 0           # 最多接前 N 只（按 rank，0=不限）
monitor:
  enabled: true
  interval_seconds: 15
  auction_interval_seconds: 30
  alert_cooldown_minutes: 30
  thresholds:
    stop_loss_buffer_pct: 0.01
    time_stop_warn_days: 4
    position_drop_pct: 0.05
    position_gain_pct: 0.08
    breakout_volume_ratio: 2.0
    watchlist_jump_pct: 0.03
    market_surge_limit_up: 30
    market_crash_limit_down: 30
    index_drop_pct: 0.02
  notify:
    macos: true
    log_file: data/monitor_alerts.jsonl
    webhook: ''
review:
  enabled: true
  auto_review: true
  report_format: markdown
  save_path: data/reviews
